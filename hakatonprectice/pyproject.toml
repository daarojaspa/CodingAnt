[project]
name = "cyborg-ant"
version = "0.1.0"
description = "Raw agent + 3 basic tools (P1) — a hand-written coding agent loop"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-mock",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cyborg_ant"]

[tool.pytest.ini_options]
markers = [
    "acceptance: real, paid API calls; deselected by default",
]
addopts = "-m 'not acceptance'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
